name: Publish registry

# Builds the registry JSON and serves it from GitHub Pages. That is what
# `shadcn add @corsair-ui/<item>` reads:
# https://kevingirelli.github.io/corsair-ui/r/{name}.json
# and the React Native items, for `shadcn add @corsair-native/<item>`:
# https://kevingirelli.github.io/corsair-ui/r/native/{name}.json
on:
  push:
    branches: [main]
    paths:
      - registry.json
      - registry/**
  workflow_dispatch:

# Deploy one build at a time, and let a deploy that already started finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Registry schema
        run: pnpm registry:validate && pnpm registry:native:validate
      # The web build first: the React Native one goes into its r/native folder.
      - name: Build
        run: pnpm registry:build && pnpm registry:native:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/registry

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}r/registry.json
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
